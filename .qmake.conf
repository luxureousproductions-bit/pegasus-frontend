TOP_SRCDIR=$$PWD
TOP_BUILDDIR=$$shadowed($$PWD)

GIT_REVISION = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    describe \
    --always --dirty)

GIT_DATE = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    log \
    -1 \
    --format=%cd \
    --date=short)

GIT_COMMIT_CNT = $$system(git \
    --git-dir \"$${TOP_SRCDIR}/.git\" \
    --work-tree \"$${TOP_SRCDIR}\" \
    rev-list \
    --count HEAD)

# Pegasus X: the build number. Builds made by GitHub use 2000 + the workflow
# run number, which goes up with every build (also the Android versionCode);
# builds made elsewhere use the commit count.
PEGASUSX_BUILD = $${GIT_COMMIT_CNT}
PEGASUSX_RUN_NUMBER = $$(GITHUB_RUN_NUMBER)
!isEmpty(PEGASUSX_RUN_NUMBER): PEGASUSX_BUILD = $$num_add(2000, $${PEGASUSX_RUN_NUMBER})
isEmpty(PEGASUSX_BUILD): PEGASUSX_BUILD = 0

COMMON_DEFINES = \
    QT_DEPRECATED_WARNINGS \
    QT_DISABLE_DEPRECATED_BEFORE=0x050C00 \
    QT_NO_CAST_TO_ASCII \
    QT_NO_PROCESS_COMBINED_ARGUMENT_START \
    QT_NO_URL_CAST_FROM_STRING \
    GIT_REVISION=\\\"$$GIT_REVISION\\\" \
    GIT_DATE=\\\"$$GIT_DATE\\\" \
    PEGASUSX_BUILD=$$PEGASUSX_BUILD
