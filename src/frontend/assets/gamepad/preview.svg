<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="340" viewBox="0 0 512 340">
  <!-- Pegasus X: Settings > Gamepad layout's controller (GamepadPreview.qml):
       an Xbox Series layout in white outlines, no fill. Guide: the
       XBSX-Experience theme's sphere (assets/images/Xbox-logo2-tight.png),
       embedded as it is. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- triggers, then bumpers, on the top edge -->
    <path d="M 98 40 C 102 20, 116 9, 138 7 C 160 5, 178 11, 184 22 L 185 30"/>
    <path d="M 414 40 C 410 20 396 9 374 7 C 352 5 334 11 328 22 L 327 30"/>
    <path d="M 58 84 C 66 58, 90 40, 120 34 C 152 28, 188 29, 208 36 L 208 45"/>
    <path d="M 454 84 C 446 58 422 40 392 34 C 360 28 324 29 304 36 L 304 45"/>
    <!-- the body and its grips -->
    <path d="M 118 50 C 170 40, 216 44, 256 44 C 296 44, 342 40, 394 50 C 440 58, 470 84, 484 132 C 500 190, 512 262, 494 302 C 478 336, 424 336, 404 306 C 386 278, 366 256, 334 254 L 178 254 C 146 256, 126 278, 108 306 C 88 336, 34 336, 18 302 C 0 262, 12 190, 28 132 C 42 84, 72 58, 118 50 Z"/>
    <!-- left stick (upper left), right stick (lower right): double rings -->
    <circle cx="140" cy="120" r="32"/>
    <circle cx="140" cy="120" r="20"/>
    <circle cx="322" cy="206" r="32"/>
    <circle cx="322" cy="206" r="20"/>
    <!-- d-pad (lower left) -->
    <path d="M 183 170 L 207 170 Q 209 170 209 172 L 209 192 L 229 192 Q 231 192 231 194 L 231 218 Q 231 220 229 220 L 209 220 L 209 240 Q 209 242 207 242 L 183 242 Q 181 242 181 240 L 181 220 L 161 220 Q 159 220 159 218 L 159 194 Q 159 192 161 192 L 181 192 L 181 172 Q 181 170 183 170 Z"/>
    <!-- Y top, X left, B right, A bottom -->
    <circle cx="372" cy="86" r="15"/>
    <circle cx="338" cy="120" r="15"/>
    <circle cx="406" cy="120" r="15"/>
    <circle cx="372" cy="154" r="15"/>
    <!-- View, Menu -->
    <circle cx="222" cy="121" r="7.5"/>
    <circle cx="290" cy="121" r="7.5"/>
    <!-- Guide -->
    <circle cx="256" cy="80" r="20"/>
  </g>
  <g fill="#ffffff" font-family="DejaVu Sans" font-weight="bold" font-size="16" text-anchor="middle">
    <text x="372" y="91.5">Y</text>
    <text x="338" y="125.5">X</text>
    <text x="406" y="125.5">B</text>
    <text x="372" y="159.5">A</text>
  </g>
  <image x="242" y="66" width="28" height="28" xlink:href="data:image/png;base64,"/>
</svg>
