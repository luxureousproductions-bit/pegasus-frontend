# Pegasus X: compiles the desktop builds (Linux, Windows) of a branch and runs
# the tests on Linux, so changes made for Android are known to still build
# elsewhere. The Windows build is zipped (pegasus-x-windows.zip: unzip and
# run pegasus-fe.exe) as the run's artifact and on the pegasus-x-latest
# release next to the APKs.
#
# Parked (Nov 2 2026): Android only until it's stable, so this runs only when
# started by hand (Actions > Compile check > Run workflow). What desktop will
# need is kept on the Project Board ("Desktop notes"). Started by hand, it
# still puts the Windows zip on pegasus-x-latest for the updater.
name: Compile check - Linux, Windows
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0}
      - name: Install Qt 5.15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qtbase5-dev qtbase5-private-dev qtdeclarative5-dev \
            qtmultimedia5-dev libqt5svg5-dev libqt5gamepad5-dev qttools5-dev-tools \
            qml-module-qtquick2 qml-module-qttest xvfb
      - name: Build
        run: |
          set -o pipefail
          mkdir build && cd build
          qmake ..
          make -j"$(nproc)" 2>&1 | tee ../build.log
      - name: Test
        run: |
          set -o pipefail
          cd build && xvfb-run -a make -k check 2>&1 | tee ../test.log | tail -n 60
      - name: Report tests
        if: always()
        run: |
          [ -f test.log ] || exit 0
          echo "::notice::$(grep -c '^Totals' test.log) test programs ran, $(grep -c '^FAIL!' test.log) failures"
          grep -E "^FAIL!" test.log | head -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  windows:
    runs-on: windows-2022
    env:
      SDL_VERSION: "2.32.10"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'
          tools: 'tools_mingw,qt.tools.win64_mingw810'
      # Pegasus X: OpenSSL for https. Qt's tools only offer OpenSSL 3 now
      # (tools_opensslv3_x64); Qt 5.15.2's loader also tries libssl-3-x64.dll
      - name: OpenSSL (Pegasus X)
        continue-on-error: true
        shell: bash
        run: |
          pip install -q aqtinstall
          aqt install-tool windows desktop tools_opensslv3_x64 -O ssl || echo "::warning::tools_opensslv3_x64 couldn't be installed"
          find ssl -iname "libssl*.dll" -o -iname "libcrypto*.dll" | while read -r f; do echo "::notice::OpenSSL: $f"; done
      # Pegasus X: the same build number as the Android build of this commit
      # (the updater compares it with the pegasus-x-latest release's)
      - name: Build number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh run list -w android.yml -c "$GITHUB_SHA" --json number -q '.[0].number' 2>/dev/null || true)
          [ -n "$N" ] || N="$GITHUB_RUN_NUMBER"
          echo "PEGASUSX_RUN_NUMBER=$N" >> "$GITHUB_ENV"
          echo "::notice::build number $((2000 + N)) (android run $N)"
      # Pegasus X: controllers through SDL2, as upstream Pegasus does on
      # Windows (Qt's MinGW package has no gamepad backend plugin); SDL2 also
      # gives the battery level to themes
      - name: SDL2 (Pegasus X)
        shell: bash
        run: |
          curl -sSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-devel-${SDL_VERSION}-mingw.tar.gz" | tar xzf -
          mv "SDL2-${SDL_VERSION}/x86_64-w64-mingw32" sdl2
          ls sdl2/bin/SDL2.dll sdl2/include/SDL2/SDL.h
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          export PATH="$IQTA_TOOLS/mingw810_64/bin:$PATH"
          SDL="$(cd sdl2 && pwd -W)"
          mkdir build && cd build
          GITHUB_RUN_NUMBER="$PEGASUSX_RUN_NUMBER" qmake .. \
            USE_SDL_GAMEPAD=1 USE_SDL_POWER=1 \
            SDL_LIBS="-L$SDL/lib -lSDL2" SDL_INCLUDES="$SDL/include/SDL2"
          mingw32-make -j4 2>&1 | tee ../build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      # Pegasus X: the program with the Qt it needs next to it (windeployqt),
      # OpenSSL for https (the scraper, the theme gallery, the updater)
      # (windeployqt can't find the platform plugin in this install, so the Qt
      # parts are copied by hand: the DLLs the app and themes use, the plugins,
      # the QML modules, the MinGW runtime)
      - name: Deploy Qt (Pegasus X)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter pegasus-fe.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::pegasus-fe.exe not found"; exit 1 }
          $out = "dist\pegasus-x"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $exe.FullName $out\
          $qt = $env:QT_ROOT_DIR
          $dlls = @("Qt5Core","Qt5Gui","Qt5Network","Qt5Qml","Qt5QmlModels","Qt5QmlWorkerScript","Qt5Quick","Qt5QuickShapes",
                    "Qt5QuickParticles","Qt5QuickTemplates2","Qt5QuickControls2","Qt5Sql","Qt5Multimedia",
                    "Qt5MultimediaQuick","Qt5Svg","Qt5Concurrent","Qt5Widgets","Qt5QuickWidgets","Qt5OpenGL",
                    "libgcc_s_seh-1","libstdc++-6","libwinpthread-1","libEGL","libGLESv2","opengl32sw","d3dcompiler_47")
          foreach ($d in $dlls) { if (Test-Path "$qt\bin\$d.dll") { Copy-Item "$qt\bin\$d.dll" $out\ } else { Write-Host "::warning::no $d.dll" } }
          foreach ($p in @("platforms","imageformats","sqldrivers","mediaservice","audio","playlistformats","iconengines","styles")) {
            if (Test-Path "$qt\plugins\$p") {
              New-Item -ItemType Directory -Force "$out\$p" | Out-Null
              Get-ChildItem "$qt\plugins\$p" -Filter *.dll | Copy-Item -Destination "$out\$p\"
            } else { Write-Host "::warning::no plugins\$p" }
          }
          foreach ($m in @("QtQuick","QtQuick.2","QtQml","QtGraphicalEffects","QtMultimedia","Qt","QtQuick.Timeline")) {
            if (Test-Path "$qt\qml\$m") { Copy-Item -Recurse "$qt\qml\$m" "$out\$m" } else { Write-Host "::warning::no qml\$m" }
          }
          # debug copies (a Food.dll next to its Foo.dll: Qt5Cored.dll, qjpegd.dll)
          # and .pdb files: not shipped. Only the twin test tells a debug copy
          # from a name that happens to end in d (Qt5Gamepad.dll, qtxinputgamepad.dll).
          Get-ChildItem $out -Recurse -File | Where-Object {
            ($_.Name -match "\.pdb$|\.prl$") -or
            ($_.Name -match "d\.dll$" -and (Test-Path (Join-Path $_.DirectoryName ($_.Name -replace "d\.dll$", ".dll"))))
          } | Remove-Item
          Copy-Item sdl2\bin\SDL2.dll $out\
          # every DLL the program imports must be beside it (or be Windows' own)
          $have = Get-ChildItem $out -Filter *.dll | ForEach-Object { $_.Name.ToLower() }
          $imports = (& "$env:IQTA_TOOLS\mingw810_64\bin\objdump.exe" -p "$out\pegasus-fe.exe" | Select-String "DLL Name: (.+)" | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() })
          $missing = $imports | Where-Object { $have -notcontains $_ -and $_ -notmatch "^(kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|ws2_32|msvcrt|winmm|version|imm32|setupapi|dwmapi|uxtheme|netapi32|userenv|wtsapi32|mpr|winspool|comdlg32|shlwapi|crypt32|dnsapi|iphlpapi|bcrypt|ncrypt|rpcrt4|secur32|d3d9|d3d11|dxgi|hid|api-ms-.*|ext-ms-.*)\.dll$" }
          if ($missing) { Write-Host "::error::not packaged: $($missing -join ', ')"; exit 1 }
          Write-Host "::notice::imports: $($imports -join ', ')"
          Write-Host "::notice::deployed: $((Get-ChildItem $out -Recurse -File).Count) files"
      - name: Package (Pegasus X)
        shell: bash
        run: |
          for f in libssl-3-x64.dll libcrypto-3-x64.dll libssl-1_1-x64.dll libcrypto-1_1-x64.dll; do
            src=$(find ssl -iname "$f" 2>/dev/null | head -n 1)
            [ -n "$src" ] && cp "$src" dist/pegasus-x/
          done
          ls dist/pegasus-x/libssl* >/dev/null 2>&1 || echo "::warning::no OpenSSL DLLs: https won't work in this build"
          cp LICENSE.md README.md dist/pegasus-x/
          (cd dist && 7z a -r pegasus-x-windows.zip pegasus-x > /dev/null) || { echo "::error::7z failed"; exit 1; }
          echo "::notice::pegasus-x-windows.zip: $(du -m dist/pegasus-x-windows.zip | cut -f1) MB"
      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-x-windows
          path: dist/pegasus-x-windows.zip
      - name: Attach to the latest-build release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/pegasus-x'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload pegasus-x-latest dist/pegasus-x-windows.zip --clobber \
            || echo "::warning::Couldn't attach the zip to the pegasus-x-latest release (it's the run's artifact)"
