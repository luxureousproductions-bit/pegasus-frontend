# Pegasus X: compiles the desktop builds (Linux, Windows) of a branch and runs
# the tests on Linux, so changes made for Android are known to still build
# elsewhere. The Windows build is zipped (pegasus-x-windows.zip: unzip and
# run pegasus-fe.exe) as the run's artifact and on the pegasus-x-latest
# release next to the APKs.
name: Compile check - Linux, Windows
on:
  push:
    branches: [pegasus-x]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0}
      - name: Install Qt 5.15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qtbase5-dev qtbase5-private-dev qtdeclarative5-dev \
            qtmultimedia5-dev libqt5svg5-dev libqt5gamepad5-dev qttools5-dev-tools \
            qml-module-qtquick2 qml-module-qttest xvfb
      - name: Build
        run: |
          set -o pipefail
          mkdir build && cd build
          qmake ..
          make -j"$(nproc)" 2>&1 | tee ../build.log
      - name: Test
        run: |
          set -o pipefail
          cd build && xvfb-run -a make -k check 2>&1 | tee ../test.log | tail -n 60
      - name: Report tests
        if: always()
        run: |
          [ -f test.log ] || exit 0
          echo "::notice::$(grep -c '^Totals' test.log) test programs ran, $(grep -c '^FAIL!' test.log) failures"
          grep -E "^FAIL!" test.log | head -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0}
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'
          tools: 'tools_mingw,qt.tools.win64_mingw810'
      # Pegasus X: OpenSSL for https. Qt's tools only offer OpenSSL 3 now
      # (tools_opensslv3_x64); Qt 5.15.2's loader also tries libssl-3-x64.dll
      - name: OpenSSL (Pegasus X)
        continue-on-error: true
        shell: bash
        run: |
          pip install -q aqtinstall
          aqt install-tool windows desktop tools_opensslv3_x64 -O ssl || echo "::warning::tools_opensslv3_x64 couldn't be installed"
          find ssl -iname "libssl*.dll" -o -iname "libcrypto*.dll" | while read -r f; do echo "::notice::OpenSSL: $f"; done
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          export PATH="$IQTA_TOOLS/mingw810_64/bin:$PATH"
          mkdir build && cd build
          qmake ..
          mingw32-make -j4 2>&1 | tee ../build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      # Pegasus X: the program with the Qt it needs next to it (windeployqt),
      # OpenSSL for https (the scraper, the theme gallery, the updater)
      - name: Package (Pegasus X)
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw810_64/bin:$PATH"
          say() { echo "::error::$*"; }
          EXE=$(find build -name "pegasus-fe.exe" | head -n 1)
          [ -n "$EXE" ] || { say "pegasus-fe.exe not found: $(find build -name '*.exe' | tr '\n' ' ')"; exit 1; }
          echo "::notice::exe: $EXE"
          mkdir -p dist/pegasus-x
          cp "$EXE" dist/pegasus-x/
          WDQ=$(command -v windeployqt || find "$QT_ROOT_DIR" "$RUNNER_WORKSPACE/Qt" -name "windeployqt.exe" 2>/dev/null | head -n 1)
          [ -n "$WDQ" ] || { say "windeployqt not found (QT_ROOT_DIR=$QT_ROOT_DIR)"; exit 1; }
          "$WDQ" --release --compiler-runtime --no-translations --qmldir src/frontend dist/pegasus-x/pegasus-fe.exe > wdq.log 2>&1 \
            || { say "windeployqt failed: $(tail -n 5 wdq.log | tr '\n' ' ')"; exit 1; }
          for f in libssl-3-x64.dll libcrypto-3-x64.dll libssl-1_1-x64.dll libcrypto-1_1-x64.dll; do
            src=$(find ssl -iname "$f" 2>/dev/null | head -n 1)
            [ -n "$src" ] && cp "$src" dist/pegasus-x/
          done
          ls dist/pegasus-x/libssl* >/dev/null 2>&1 || echo "::warning::no OpenSSL DLLs: https won't work in this build"
          cp LICENSE.md README.md dist/pegasus-x/
          (cd dist && 7z a -r pegasus-x-windows.zip pegasus-x > /dev/null) || { say "7z failed"; exit 1; }
          echo "::notice::pegasus-x-windows.zip: $(du -m dist/pegasus-x-windows.zip | cut -f1) MB, $(ls dist/pegasus-x | wc -l) files"
      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-x-windows
          path: dist/pegasus-x-windows.zip
      - name: Attach to the latest-build release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/pegasus-x'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload pegasus-x-latest dist/pegasus-x-windows.zip --clobber \
            || echo "::warning::Couldn't attach the zip to the pegasus-x-latest release (it's the run's artifact)"
