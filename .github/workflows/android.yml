name: Build - Android
on: [push, pull_request, workflow_dispatch]

env:
  TOOLS_URL: https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1
  QT_TARGET: android
  QT_VERSION: qt51510
  QT_VERSION_PRETTY: "5.15.10"


jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - name: android
            abi: armeabi-v7a
          - name: android64
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0, fetch-tags: true}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Install Qt
        run: |
          .circleci/prepare.sh
          curl -L ${TOOLS_URL}/openssl-111t_android.tar.xz | tar xJf - -C /opt/
      # Pegasus X: the emulator lists are ES-DE's, refreshed from its
      # repository on every build so new emulators are always included; the
      # copy in this repository is kept if the download fails or looks wrong
      - name: Refresh ES-DE emulator lists
        continue-on-error: true
        run: |
          BASE=https://gitlab.com/es-de/emulationstation-de/-/raw/master/resources/systems/android
          DEST=src/backend/providers/esde/resources
          if curl -fsSL "$BASE/es_systems.xml" -o /tmp/es_systems.xml && curl -fsSL "$BASE/es_find_rules.xml" -o /tmp/es_find_rules.xml \
             && grep -q '<systemList' /tmp/es_systems.xml && [ "$(grep -c '<system>' /tmp/es_systems.xml)" -ge 100 ] \
             && grep -q '<ruleList' /tmp/es_find_rules.xml; then
            cp /tmp/es_systems.xml /tmp/es_find_rules.xml "$DEST/"
            echo "::notice::ES-DE emulator lists refreshed: $(grep -c '<system>' $DEST/es_systems.xml) systems, $(grep -c '<emulator ' $DEST/es_find_rules.xml) emulators"
          else
            echo "::warning::Could not refresh the ES-DE emulator lists, using the copy in the repository"
          fi

      - name: Build
        env:
          BUILDOPTS: ANDROID_ABIS=${{ matrix.abi }} FORCE_QT_PNG=1
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          .circleci/build.sh 2>&1 | tee build.log
      # Pegasus X: show compiler errors in the run summary, which is readable
      # without downloading the full logs
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|Error [0-9]|undefined reference" build.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package (debug)
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: /opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          --input src/app/android-pegasus-fe-deployment-settings.json
          --output ${PWD}/installdir
          --android-platform android-30
          --gradle
      - name: Package (debug), stage
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        run: cp
          installdir/build/outputs/apk/debug/installdir-debug.apk
          dist/pegasus-x_$(git describe --always)_${{ matrix.name }}.apk

      # Pegasus X: sign every build with the private Pegasus X key, so test
      # builds and releases all install over each other. The key lives only in
      # the repository secrets PEGASUSX_KEYSTORE (base64 PKCS12) and
      # PEGASUSX_KEYSTORE_PASSWORD. Without them (eg. in someone else's fork)
      # the build keeps the runner's throwaway debug key.
      - name: Package (debug), sign with Pegasus X key
        id: sign
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        env:
          KS_B64: ${{ secrets.PEGASUSX_KEYSTORE }}
          KS_PASS: ${{ secrets.PEGASUSX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Pegasus X signing secrets not set, the APK keeps a throwaway debug key"
            exit 0
          fi
          KS="$RUNNER_TEMP/pegasusx.ks"
          # Tolerate line breaks, spaces and CRLFs from pasting the secret
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            echo "::warning::PEGASUSX_KEYSTORE is not valid base64 text, the APK keeps a throwaway debug key"
            exit 0
          fi
          # Accept both PKCS12 (.p12) and JKS (.jks/.keystore) keystores
          KS_TYPE=""
          for t in PKCS12 JKS; do
            if keytool -list -keystore "$KS" -storetype "$t" -storepass:env KS_PASS >/dev/null 2>&1; then
              KS_TYPE="$t"; break
            fi
          done
          if [ -z "$KS_TYPE" ]; then
            echo "::warning::Could not open the keystore (wrong PEGASUSX_KEYSTORE_PASSWORD, or a damaged keystore), the APK keeps a throwaway debug key"
            rm -f "$KS"
            exit 0
          fi
          # Use the key named "pegasusx" when present, else the keystore's first key
          ALIASES="$(keytool -list -v -keystore "$KS" -storetype "$KS_TYPE" -storepass:env KS_PASS 2>/dev/null \
                     | sed -n 's/^Alias name: //p')"
          if printf '%s\n' "$ALIASES" | grep -qx pegasusx; then ALIAS=pegasusx
          else ALIAS="$(printf '%s\n' "$ALIASES" | head -n 1)"; fi
          echo "::notice::Keystore type $KS_TYPE, signing with key alias '$ALIAS'"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            if ! "$APKSIGNER" sign --ks "$KS" --ks-type "$KS_TYPE" \
                --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$ALIAS" "$apk" 2> "$RUNNER_TEMP/sign.err"; then
              echo "::warning::apksigner failed, the APK keeps a throwaway debug key: $(tail -n 3 "$RUNNER_TEMP/sign.err" | tr '\n' ' ')"
              rm -f "$KS"
              exit 0
            fi
          done
          rm -f "$KS"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Package (debug), report signing key
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        run: |
          echo "::notice::$(git describe --always) signed with $(keytool -printcert -jarfile dist/*.apk | grep -m1 'SHA256:')"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then
            echo "::notice::$(git describe --always) $("$AAPT" dump badging dist/*.apk | grep -o "versionCode='[0-9]*'")"
          fi

      # Pegasus X: a version tag (v1.0, v1.1-beta1, ...) publishes a GitHub
      # Release with the APKs. Tags with a dash are marked as pre-releases.
      # Only builds signed with the Pegasus X key are ever published.
      - name: Publish release (Pegasus X)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          NOTES=".github/pegasus-x-release-notes.md"
          gh release create "$TAG" $PRE --title "Pegasus X $TAG" --notes-file "$NOTES" || true
          gh release upload "$TAG" dist/*.apk --clobber

      - name: Package (release), prep
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          curl -LO https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1/aks.enc
          openssl aes-256-cbc -k "${{ secrets.AKS_ENC_KEY }}" -in aks.enc -out aks -d
      - name: Package (release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: /opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          --input src/app/android-pegasus-fe-deployment-settings.json
          --output ${PWD}/installdir
          --android-platform android-30
          --gradle
          --sign ./aks "${{ secrets.AKS_ALIAS }}"
          --storepass "${{ secrets.AKS_STOREPASS }}"
          --keypass "${{ secrets.AKS_KEYPASS }}"
      - name: Package (release), stage
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: cp
          installdir/build/outputs/apk/release/installdir-release-signed.apk
          dist/pegasus-fe_$(git describe --always)_${{ matrix.name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist

      - name: Deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: mmatyas/pegasus-deploy-staging
          personal_token: ${{ secrets.PEGASUS_GHACTIONS_TOKEN }}
          publish_branch: continuous-${{ matrix.name }}
          publish_dir: ./dist
          force_orphan: true
